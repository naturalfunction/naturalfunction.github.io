{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ .Site.Title }}",
  "url": "{{ .Site.BaseURL }}",
  "description": "{{ .Site.Params.sidebar.subtitle }}",
  "author": {
    "@type": "Person",
    "name": "{{ .Site.Title }}"
  }
}
</script>
{{ else if .IsPage }}
{{ if eq .Type "post" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ .Title }}",
  "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Summary }}{{ end }}",
  "url": "{{ .Permalink }}",
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "author": {
    "@type": "Person",
    "name": "{{ .Site.Title }}"
  },
  "publisher": {
    "@type": "Person",
    "name": "{{ .Site.Title }}"
  },
  {{ with .Params.image }}
  "image": "{{ $.Permalink }}{{ . }}",
  {{ end }}
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  },
  {{ with .Params.categories }}
  "articleSection": {{ index . 0 | jsonify }},
  {{ end }}
  {{ with .Params.tags }}
  "keywords": {{ . | jsonify }},
  {{ end }}
  "wordCount": {{ .WordCount }},
  "inLanguage": "{{ .Site.LanguageCode }}"
}
</script>
{{ end }}
{{ end }}
